[project]
name = "mgm-marketing-ai-server"
version = "0.1.0"
description = "Casino patron marketing AI backend (FastAPI + Motor + langgraph)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "motor>=3.6",
    "pymongo>=4.9",
    "httpx>=0.27",
    "openai>=1.55",
    "voyageai[local]>=0.3.5",
    "langgraph>=0.2.60",
    "langchain-core>=0.3.20",
    "langgraph-checkpoint-mongodb>=0.1.0",
    "python-dotenv>=1.0",
    "faker>=33.0",
    "orjson>=3.10",
    "structlog>=24.4",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[project.scripts]
mgm-server = "app.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "TID"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
