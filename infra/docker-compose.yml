# ------------------------------------------------------------------------------
# LLM Gateway stack for macau-gaming-marketing-ai-project.
#
# Services:
#   - litellm : OpenAI-compatible gateway. Routes chat traffic to Azure OpenAI
#               (with an optional OpenAI fallback slot reserved in config.yaml).
#   - redis   : LiteLLM response cache + routing state.
#
# NOTE: Voyage embeddings are NO LONGER served here. The Python backend
# (../server) calls the `voyageai[local]` SDK in-process. The TEI container
# was removed as part of the migration to the Python stack.
#
# Target host : Debian 12 x86_64, CPU-only (Xeon/EPYC class).
#
# Usage:
#   cp .env.example ../.env   # fill AZURE_OPENAI_* and LITELLM_MASTER_KEY
#   docker compose -f infra/docker-compose.yml up -d
#   curl http://localhost:4000/health/liveliness
# ------------------------------------------------------------------------------

name: mgm-llm-gateway

networks:
  llm-net:
    driver: bridge

volumes:
  redis-data:

services:
  # ---------------------------------------------------------------------------
  # LiteLLM Gateway (chat only)
  # ---------------------------------------------------------------------------
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: mgm-litellm
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_started
    ports:
      - "4000:4000"
    environment:
      # Chat: Azure OpenAI (primary)
      AZURE_OPENAI_ENDPOINT:    ${AZURE_OPENAI_ENDPOINT}
      AZURE_OPENAI_API_KEY:     ${AZURE_OPENAI_API_KEY}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2024-12-01-preview}
      # Chat: OpenAI fallback (unused unless the slot is uncommented in config.yaml)
      OPENAI_API_KEY:           ${OPENAI_API_KEY:-}
      # LiteLLM master key (clients must present this as Bearer token)
      LITELLM_MASTER_KEY:       ${LITELLM_MASTER_KEY}
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "2"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys;sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness').status==200 else sys.exit(1)"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    networks:
      - llm-net

  # ---------------------------------------------------------------------------
  # Redis — LiteLLM response cache
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: mgm-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - llm-net
