# ------------------------------------------------------------------------------
# LiteLLM Gateway configuration (chat only).
#
# App-side code addresses a single model alias:
#   - chat-primary  → Azure OpenAI  gpt-5.4-mini-2  (active)
#                     Qwen 3.6 via external vLLM     (disabled, switch slot)
#
# Embeddings are NOT served through LiteLLM. The Python backend
# (../../server) calls the voyageai[local] SDK in-process. The former
# `voyage-4-nano` alias has been removed together with the TEI container.
#
# Clients authenticate with LITELLM_MASTER_KEY as Bearer token.
# ------------------------------------------------------------------------------

model_list:
  # ==== Chat: Azure OpenAI (primary) ========================================
  - model_name: chat-primary
    litellm_params:
      model: azure/gpt-5.4-mini-2
      api_base: os.environ/AZURE_OPENAI_ENDPOINT
      api_key:  os.environ/AZURE_OPENAI_API_KEY
      api_version: os.environ/AZURE_OPENAI_API_VERSION

  # ==== Chat: Qwen 3.6 — external GPU cluster via vLLM (disabled) ===========
  # To switch FROM Azure OpenAI TO Qwen 3.6:
  #   1. Comment out the Azure OpenAI block above.
  #   2. Uncomment this block.
  #   3. Set QWEN_API_BASE and QWEN_API_KEY in your .env / infra/.env.
  #   4. docker compose up -d litellm
  #   5. Verify with the smoke test:
  #        docker compose exec backend uv run python -m app.smoke.gateway_smoke
  #
  # To switch back to Azure OpenAI:
  #   Reverse step 1 (uncomment Azure, comment Qwen) and repeat steps 4–5.
  #   Azure env vars are always present in the container — no env changes needed.
  #
  # - model_name: chat-primary
  #   litellm_params:
  #     model: openai/qwen3-6               # openai/ prefix = OpenAI-compatible endpoint (vLLM)
  #     api_base: os.environ/QWEN_API_BASE  # e.g. https://your-cluster.example.com/v1
  #     api_key:  os.environ/QWEN_API_KEY

  # ==== Chat: OpenAI fallback (disabled, reserved slot) =====================
  # To enable:
  #   1. Uncomment this block.
  #   2. Uncomment router_settings.fallbacks below.
  #   3. Set OPENAI_API_KEY in infra/.env
  #   4. docker compose restart litellm
  #
  # - model_name: chat-primary
  #   litellm_params:
  #     model: openai/gpt-4o-mini
  #     api_key: os.environ/OPENAI_API_KEY

router_settings:
  redis_host: redis
  redis_port: 6379
  routing_strategy: simple-shuffle
  # Enable fallback once the OpenAI slot above is uncommented:
  # fallbacks:
  #   - chat-primary: [chat-primary]  # LiteLLM will attempt the next matching entry
  num_retries: 2
  timeout: 60
  allowed_fails: 3
  cooldown_time: 30

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # Set to true to disable the /v1 auth requirement (not recommended in prod)
  # disable_auth: false

litellm_settings:
  drop_params: true          # silently drop unsupported params instead of erroring
  set_verbose: false
  request_timeout: 60
  cache: true
  cache_params:
    type: redis
    host: redis
    port: 6379
    ttl: 3600                # 1h cache for identical requests
  # Observability (Langfuse) is intentionally NOT enabled in this phase.
